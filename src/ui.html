<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --gap: 10px;
        --radius: 6px;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 11px/1.4 Inter, -apple-system, system-ui, sans-serif;
        color: var(--figma-color-text, #1a1a1a);
        background: var(--figma-color-bg, #fff);
        display: flex;
        flex-direction: column;
      }
      header {
        padding: var(--gap);
        display: flex;
        gap: 6px;
        align-items: center;
        border-bottom: 1px solid var(--figma-color-border, #e5e5e5);
      }
      #search {
        flex: 1;
        padding: 6px 8px;
        border: 1px solid var(--figma-color-border, #d0d0d0);
        border-radius: var(--radius);
        background: var(--figma-color-bg, #fff);
        color: inherit;
        font: inherit;
      }
      button {
        font: inherit;
        border-radius: var(--radius);
        border: 1px solid var(--figma-color-border, #d0d0d0);
        background: var(--figma-color-bg-secondary, #f5f5f5);
        color: inherit;
        padding: 6px 10px;
        cursor: pointer;
      }
      button:hover { background: var(--figma-color-bg-hover, #ececec); }
      button.primary {
        background: var(--figma-color-bg-brand, #0d99ff);
        border-color: transparent;
        color: var(--figma-color-text-onbrand, #fff);
        font-weight: 600;
      }
      button.primary:disabled { opacity: 0.4; cursor: not-allowed; }

      #grid {
        flex: 1;
        overflow-y: auto;
        padding: var(--gap);
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
        align-content: start;
      }
      .tile {
        border: 1px solid var(--figma-color-border, #e5e5e5);
        border-radius: var(--radius);
        padding: 6px;
        cursor: pointer;
        text-align: center;
        background: var(--figma-color-bg, #fff);
        overflow: hidden;
      }
      .tile.selected {
        border-color: var(--figma-color-bg-brand, #0d99ff);
        box-shadow: 0 0 0 1px var(--figma-color-bg-brand, #0d99ff);
      }
      .tile .thumb {
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 4px;
      }
      .tile .thumb img {
        max-width: 100%;
        max-height: 120px;
        object-fit: contain;
      }
      .tile .name {
        font-size: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tile .dims { font-size: 9px; color: var(--figma-color-text-secondary, #888); }

      #empty {
        flex: 1;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 24px;
        text-align: center;
        color: var(--figma-color-text-secondary, #888);
      }

      footer {
        border-top: 1px solid var(--figma-color-border, #e5e5e5);
        padding: var(--gap);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .row { display: flex; gap: 6px; align-items: center; }
      .row label { color: var(--figma-color-text-secondary, #888); }
      select, input[type="number"] {
        padding: 5px 6px;
        border: 1px solid var(--figma-color-border, #d0d0d0);
        border-radius: var(--radius);
        background: var(--figma-color-bg, #fff);
        color: inherit;
        font: inherit;
      }
      select { flex: 1; }
      input[type="number"] { width: 64px; }
      .dimsep { color: var(--figma-color-text-secondary, #888); }
      #status { font-size: 10px; color: var(--figma-color-text-secondary, #888); min-height: 13px; }
    </style>
  </head>
  <body>
    <header>
      <input id="search" type="search" placeholder="Search brand assets…" />
      <button id="import" title="Import: convert selected frames to components, or upload SVG/PNG/JPG if nothing is selected">↑ Import</button>
      <button id="refresh" title="Re-scan the file">↻</button>
      <input id="file" type="file" multiple accept=".svg,.png,.jpg,.jpeg" style="display:none" />
    </header>

    <div id="grid"></div>
    <div id="empty">
      <strong>No brand components found</strong>
      <span>This plugin places existing brand-approved components. Open a file
      that contains the brand component library, then press ↻.</span>
    </div>

    <footer>
      <div class="row">
        <label for="preset">Size</label>
        <select id="preset"></select>
      </div>
      <div class="row">
        <input id="w" type="number" min="1" placeholder="W" />
        <span class="dimsep">×</span>
        <input id="h" type="number" min="1" placeholder="H" />
        <label class="row" style="margin-left:auto; gap:4px;">
          <input id="lock" type="checkbox" checked /> Lock ratio
        </label>
      </div>
      <div class="row">
        <button id="place" class="primary" style="flex:1" disabled>Place on canvas</button>
        <select id="format" title="Export format" style="flex:0 0 auto;">
          <option>PNG</option>
          <option>SVG</option>
          <option>JPG</option>
        </select>
        <button id="export" disabled>Export</button>
      </div>
      <div id="status"></div>
    </footer>

    <script>
      // Responsive breakpoint presets (width-based). Each illustration is resized to the
      // breakpoint's midpoint width; height follows the asset's native aspect ratio.
      // "Original" and "Custom" are handled specially.
      const PRESETS = [
        { label: "Original size", w: null },
        { label: "SM · 544px  (320–767)", w: 544 },
        { label: "MD · 896px  (768–1023)", w: 896 },
        { label: "LG · 1152px  (1024–1279)", w: 1152 },
        { label: "XL · 1360px  (1280–1439)", w: 1360 },
        { label: "2XL · 1584px  (1440–1727)", w: 1584 },
        { label: "3XL · 1728px  (1728+)", w: 1728 },
        { label: "Custom…", w: "custom" },
      ];

      const $ = (id) => document.getElementById(id);
      let assets = [];
      let selectedId = null;

      // --- Build the preset dropdown -------------------------------------
      PRESETS.forEach((p, i) => {
        const opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = p.label;
        $("preset").appendChild(opt);
      });

      function selectedAsset() {
        return assets.find((a) => a.id === selectedId) || null;
      }

      function applyPreset() {
        const p = PRESETS[Number($("preset").value)];
        const a = selectedAsset();
        if (p.w === "custom") return; // leave inputs editable
        if (p.w === null) {
          // Original: native dimensions.
          $("w").value = a ? a.width : "";
          $("h").value = a ? a.height : "";
          return;
        }
        // Breakpoint width; height auto-derived from the asset's aspect ratio.
        $("w").value = p.w;
        $("h").value = a ? Math.round((p.w * a.height) / a.width) : "";
      }

      function renderGrid() {
        const q = $("search").value.trim().toLowerCase();
        const grid = $("grid");
        grid.innerHTML = "";
        const filtered = assets.filter((a) => a.name.toLowerCase().includes(q));

        $("empty").style.display = assets.length === 0 ? "flex" : "none";
        grid.style.display = assets.length === 0 ? "none" : "grid";

        for (const a of filtered) {
          const tile = document.createElement("div");
          tile.className = "tile" + (a.id === selectedId ? " selected" : "");
          tile.innerHTML =
            '<div class="thumb">' +
            (a.preview ? '<img src="' + a.preview + '" />' : "—") +
            "</div>" +
            '<div class="name" title="' + a.name + '">' + a.name + "</div>" +
            '<div class="dims">' + a.width + "×" + a.height + "</div>";
          tile.onclick = () => {
            selectedId = a.id;
            renderGrid();
            applyPreset();
            setEnabled(true);
          };
          grid.appendChild(tile);
        }
      }

      // Enable/disable the place + export actions together.
      function setEnabled(on) {
        $("place").disabled = !on;
        $("export").disabled = !on;
      }

      // Read & validate the requested size; returns null (and sets status) if invalid.
      function sizeRequest() {
        const w = parseInt($("w").value, 10);
        const h = parseInt($("h").value, 10);
        if (!selectedId || !w || !h) {
          $("status").textContent = "Pick an asset and a valid size.";
          return null;
        }
        return {
          assetId: selectedId,
          width: w,
          height: h,
          lockAspect: $("lock").checked,
        };
      }

      // --- Events --------------------------------------------------------
      $("search").oninput = renderGrid;
      $("preset").onchange = applyPreset;
      $("refresh").onclick = () =>
        parent.postMessage({ pluginMessage: { type: "init" } }, "*");

      $("place").onclick = () => {
        const req = sizeRequest();
        if (!req) return;
        $("status").textContent = "Placing…";
        parent.postMessage({ pluginMessage: { type: "place", ...req } }, "*");
      };

      $("export").onclick = () => {
        const req = sizeRequest();
        if (!req) return;
        $("status").textContent = "Exporting…";
        parent.postMessage(
          { pluginMessage: { type: "export", format: $("format").value, ...req } },
          "*"
        );
      };

      // --- Import (brand team) -------------------------------------------
      // Ask the main thread to ingest the current selection; if nothing is
      // selected it replies "pick-files" and we open the upload dialog.
      $("import").onclick = () => {
        $("status").textContent = "Importing selection…";
        parent.postMessage({ pluginMessage: { type: "import-selection" } }, "*");
      };

      $("file").onchange = async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        $("status").textContent = "Reading " + files.length + " file(s)…";
        const payload = [];
        for (const f of files) {
          const ext = (f.name.split(".").pop() || "").toLowerCase();
          const name = f.name.replace(/\.[^.]+$/, "");
          if (ext === "svg") {
            payload.push({ name, format: "SVG", svg: await f.text() });
          } else {
            const buf = await f.arrayBuffer();
            payload.push({
              name,
              format: ext === "png" ? "PNG" : "JPG",
              bytes: new Uint8Array(buf),
            });
          }
        }
        $("status").textContent = "Importing " + payload.length + " illustration(s)…";
        parent.postMessage({ pluginMessage: { type: "import", files: payload } }, "*");
        e.target.value = ""; // allow re-selecting the same file later
      };

      // Trigger a browser download for exported bytes.
      function downloadBytes(name, format, width, bytes) {
        const mime =
          format === "SVG"
            ? "image/svg+xml"
            : format === "JPG"
            ? "image/jpeg"
            : "image/png";
        const ext = format.toLowerCase();
        const safe = name.replace(/[^\w.-]+/g, "_");
        const blob = new Blob([bytes], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = safe + "-" + width + "." + ext;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      // --- Messages from the main thread ---------------------------------
      onmessage = (event) => {
        const msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === "catalog") {
          assets = msg.assets;
          if (!selectedAsset()) selectedId = null;
          setEnabled(!!selectedId);
          renderGrid();
          $("status").textContent = assets.length + " brand asset(s) found.";
        } else if (msg.type === "placed") {
          $("status").textContent = "Placed “" + msg.name + "”.";
        } else if (msg.type === "exported") {
          downloadBytes(msg.name, msg.format, msg.width, msg.bytes);
          $("status").textContent = "Exported “" + msg.name + "”.";
        } else if (msg.type === "pick-files") {
          $("status").textContent = "No selection — pick file(s) to upload.";
          $("file").click();
        } else if (msg.type === "error") {
          $("status").textContent = "Error: " + msg.message;
        }
      };

      // Kick off the initial scan.
      parent.postMessage({ pluginMessage: { type: "init" } }, "*");
    </script>
  </body>
</html>
