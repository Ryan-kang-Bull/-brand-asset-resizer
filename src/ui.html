<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        flex-direction: column;
        font: 11px/1.4 Inter, -apple-system, system-ui, sans-serif;
        color: var(--figma-color-text, #1a1a1a);
        background: var(--figma-color-bg, #fff);
      }
      button {
        font: inherit;
        border: 1px solid var(--figma-color-border, #d0d0d0);
        border-radius: 6px;
        background: var(--figma-color-bg-secondary, #f5f5f5);
        color: inherit;
        padding: 6px 10px;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover { background: var(--figma-color-bg-hover, #ececec); }
      button.primary {
        background: var(--figma-color-bg-brand, #0d99ff);
        border-color: transparent;
        color: var(--figma-color-text-onbrand, #fff);
        font-weight: 600;
      }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      input, select {
        font: inherit;
        color: inherit;
        background: var(--figma-color-bg, #fff);
        border: 1px solid var(--figma-color-border, #d0d0d0);
        border-radius: 6px;
        padding: 6px 8px;
      }

      header {
        display: flex;
        gap: 6px;
        padding: 10px;
        border-bottom: 1px solid var(--figma-color-border, #e5e5e5);
      }
      #search { flex: 1; }

      #grid {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        align-content: start;
      }
      .tile {
        border: 1px solid var(--figma-color-border, #e5e5e5);
        border-radius: 8px;
        padding: 6px;
        cursor: pointer;
        background: var(--figma-color-bg, #fff);
      }
      .tile.sel {
        border-color: var(--figma-color-bg-brand, #0d99ff);
        box-shadow: 0 0 0 1px var(--figma-color-bg-brand, #0d99ff);
      }
      .tile .thumb {
        width: 100%;
        height: 130px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 6px;
        border-radius: 4px;
        /* checkerboard so transparent / dark art is always visible */
        background-color: #f4f4f4;
        background-image:
          linear-gradient(45deg, #e2e2e2 25%, transparent 25%),
          linear-gradient(-45deg, #e2e2e2 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #e2e2e2 75%),
          linear-gradient(-45deg, transparent 75%, #e2e2e2 75%);
        background-size: 14px 14px;
        background-position: 0 0, 0 7px, 7px -7px, -7px 0;
      }
      .tile .thumb img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
      .tile .thumb .none { color: var(--figma-color-text-secondary, #999); }
      .tile .name {
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tile .dims { font-size: 10px; color: var(--figma-color-text-secondary, #888); }

      #empty {
        flex: 1;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 28px;
        text-align: center;
        color: var(--figma-color-text-secondary, #888);
      }

      footer {
        padding: 10px;
        border-top: 1px solid var(--figma-color-border, #e5e5e5);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .row { display: flex; gap: 6px; align-items: center; }
      .row label { color: var(--figma-color-text-secondary, #888); }
      #preset { flex: 1; }
      #w, #h { width: 64px; }
      .grow { flex: 1; }
      #status { font-size: 10px; color: var(--figma-color-text-secondary, #888); min-height: 13px; }
    </style>
  </head>
  <body>
    <header>
      <input id="search" type="search" placeholder="Search assets…" />
      <button id="import" title="Convert selected frames to components, or upload files if nothing is selected">↑ Import</button>
      <button id="refresh" title="Re-scan the file">↻</button>
      <input id="file" type="file" multiple accept=".svg,.png,.jpg,.jpeg" hidden />
    </header>

    <div id="grid"></div>
    <div id="empty">
      <strong>No components found</strong>
      <span>Open a file containing the brand component library, then press ↻. Or use
      Import to bring illustrations in.</span>
    </div>

    <footer>
      <div class="row">
        <label for="preset">Size</label>
        <select id="preset"></select>
      </div>
      <div class="row">
        <input id="w" type="number" min="1" placeholder="W" />
        <span>×</span>
        <input id="h" type="number" min="1" placeholder="H" />
        <label class="row grow" style="justify-content:flex-end; gap:4px;">
          <input id="lock" type="checkbox" checked /> Lock ratio
        </label>
      </div>
      <div class="row">
        <button id="place" class="primary grow" disabled>Place on canvas</button>
        <select id="format" title="Export format">
          <option>PNG</option>
          <option>SVG</option>
          <option>JPG</option>
        </select>
        <button id="export" disabled>Export</button>
      </div>
      <div id="status"></div>
    </footer>

    <script>
      "use strict";

      // Responsive breakpoint presets: width = range midpoint; height auto from ratio.
      var PRESETS = [
        { label: "Original size", w: null },
        { label: "SM · 544px  (320–767)", w: 544 },
        { label: "MD · 896px  (768–1023)", w: 896 },
        { label: "LG · 1152px  (1024–1279)", w: 1152 },
        { label: "XL · 1360px  (1280–1439)", w: 1360 },
        { label: "2XL · 1584px  (1440–1727)", w: 1584 },
        { label: "3XL · 1728px  (1728+)", w: 1728 },
        { label: "Custom…", w: "custom" },
      ];

      function $(id) { return document.getElementById(id); }
      var assets = [];
      var selectedId = null;

      PRESETS.forEach(function (p, i) {
        var opt = document.createElement("option");
        opt.value = String(i);
        opt.textContent = p.label;
        $("preset").appendChild(opt);
      });

      function selectedAsset() {
        for (var i = 0; i < assets.length; i++) {
          if (assets[i].id === selectedId) return assets[i];
        }
        return null;
      }

      function setEnabled(on) {
        $("place").disabled = !on;
        $("export").disabled = !on;
      }

      function applyPreset() {
        var p = PRESETS[Number($("preset").value)];
        var a = selectedAsset();
        if (p.w === "custom") return;
        if (p.w === null) {
          $("w").value = a ? a.width : "";
          $("h").value = a ? a.height : "";
          return;
        }
        $("w").value = p.w;
        $("h").value = a ? Math.round((p.w * a.height) / a.width) : "";
      }

      function buildTile(a) {
        var tile = document.createElement("div");
        tile.className = "tile" + (a.id === selectedId ? " sel" : "");

        var thumb = document.createElement("div");
        thumb.className = "thumb";
        if (a.preview) {
          var img = document.createElement("img");
          img.src = a.preview;
          thumb.appendChild(img);
        } else {
          var none = document.createElement("span");
          none.className = "none";
          none.textContent = "no preview";
          thumb.appendChild(none);
        }

        var name = document.createElement("div");
        name.className = "name";
        name.title = a.name;
        name.textContent = a.name;

        var dims = document.createElement("div");
        dims.className = "dims";
        dims.textContent = a.width + " × " + a.height;

        tile.appendChild(thumb);
        tile.appendChild(name);
        tile.appendChild(dims);
        tile.onclick = function () {
          selectedId = a.id;
          renderGrid();
          applyPreset();
          setEnabled(true);
        };
        return tile;
      }

      function renderGrid() {
        var q = $("search").value.trim().toLowerCase();
        var grid = $("grid");
        grid.textContent = "";
        $("empty").style.display = assets.length === 0 ? "flex" : "none";
        grid.style.display = assets.length === 0 ? "none" : "grid";
        assets
          .filter(function (a) { return a.name.toLowerCase().indexOf(q) !== -1; })
          .forEach(function (a) { grid.appendChild(buildTile(a)); });
      }

      function sizeRequest() {
        var w = parseInt($("w").value, 10);
        var h = parseInt($("h").value, 10);
        if (!selectedId || !w || !h) {
          $("status").textContent = "Pick an asset and a valid size.";
          return null;
        }
        return { assetId: selectedId, width: w, height: h, lockAspect: $("lock").checked };
      }

      function send(msg) { parent.postMessage({ pluginMessage: msg }, "*"); }

      // --- Events ---
      $("search").oninput = renderGrid;
      $("preset").onchange = applyPreset;
      $("refresh").onclick = function () { send({ type: "init" }); };

      $("place").onclick = function () {
        var req = sizeRequest();
        if (!req) return;
        $("status").textContent = "Placing…";
        req.type = "place";
        send(req);
      };

      $("export").onclick = function () {
        var req = sizeRequest();
        if (!req) return;
        $("status").textContent = "Exporting…";
        req.type = "export";
        req.format = $("format").value;
        send(req);
      };

      $("import").onclick = function () {
        $("status").textContent = "Importing selection…";
        send({ type: "import-selection" });
      };

      $("file").onchange = async function (e) {
        var files = Array.prototype.slice.call(e.target.files || []);
        if (!files.length) return;
        $("status").textContent = "Reading " + files.length + " file(s)…";
        var payload = [];
        for (var i = 0; i < files.length; i++) {
          var f = files[i];
          var ext = (f.name.split(".").pop() || "").toLowerCase();
          var name = f.name.replace(/\.[^.]+$/, "");
          if (ext === "svg") {
            payload.push({ name: name, format: "SVG", svg: await f.text() });
          } else {
            var buf = await f.arrayBuffer();
            payload.push({
              name: name,
              format: ext === "png" ? "PNG" : "JPG",
              bytes: new Uint8Array(buf),
            });
          }
        }
        $("status").textContent = "Importing " + payload.length + " file(s)…";
        send({ type: "import-files", files: payload });
        e.target.value = "";
      };

      function download(name, format, width, bytes) {
        var mime = format === "SVG" ? "image/svg+xml" : format === "JPG" ? "image/jpeg" : "image/png";
        var blob = new Blob([bytes], { type: mime });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = name.replace(/[^\w.-]+/g, "_") + "-" + width + "." + format.toLowerCase();
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      // --- Messages from the main thread ---
      window.onmessage = function (event) {
        var msg = event.data.pluginMessage;
        if (!msg) return;
        if (msg.type === "catalog") {
          assets = msg.assets;
          if (!selectedAsset()) selectedId = null;
          setEnabled(!!selectedId);
          renderGrid();
          $("status").textContent = assets.length + " asset(s) found.";
        } else if (msg.type === "placed") {
          $("status").textContent = "Placed “" + msg.name + "”.";
        } else if (msg.type === "exported") {
          download(msg.name, msg.format, msg.width, msg.bytes);
          $("status").textContent = "Exported “" + msg.name + "”.";
        } else if (msg.type === "pick-files") {
          $("status").textContent = "Nothing selected — choose file(s).";
          $("file").click();
        } else if (msg.type === "error") {
          $("status").textContent = "Error: " + msg.message;
        }
      };

      send({ type: "init" });
    </script>
  </body>
</html>
